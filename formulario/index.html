<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    <title>Formulario</title>
</head>
<body>

    <main>
        <h1>Formulario</h1>
        <form>  
            <div class="container">  
                <h2>Datos personales</h2>
                <div class="row" >
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputDni">DNI:</label>
                        <input type="text" id="inputDni" name="inputDni" required>
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputNombre">Nombre:</label>
                        <input type="text" id="inputNombre" name="inputNombre" required>
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputApellido">Apellido:</label>
                        <input type="text" id="inputApellido" name="inputApellido" required>
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputGenero">Genero</label>
                        <select id="inputGenero" name="inputGenero">
                            <option value="">-Seleccione una opcion-</option>
                            <option value="hombre">Hombre</option>
                            <option value="mujer">Mujer</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputFechaNacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="inputFechaNacimiento" name="inputFechaNacimiento">
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputEstadoCivil">Estado civil</label>
                        <input type="radio" id="inputEstadoCivil" name="inputEstadoCivil">
                    </div>
                    <div class="col-lg-4 col-xl-2 border p-3">
                        <label for="inputAficiones">Aficiones</label>
                        <input type="checkbox" id="inputAficiones" name="inputAficiones">
                    </div>
                </div>
            </div>
            <div class="container">
                <h2>Dirección</h2>
                <div class="row">
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="inputCodigoPostal">Codigo Postal</label>
                        <input type="text" id="inputCodigoPostal" name="inputCodigoPostal">
                    </div>
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="inputProvincia">Provincia</label>
                        <input type="text" id="inputProvincia" name="inputProvincia">
                    </div>
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="inputLocalidad">Localidad</label>
                        <input type="text" id="inputLocalidad" name="inputLocalidad">
                    </div>
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="inputCalle">Calle</label>
                        <input type="text" id="inputCalle" name="inputCalle">
                    </div>
                </div>
            </div>
            <div class="container">
                <h2>Contacto</h2>
                <div class="row">
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="">Email</label>
                        <input type="email" id="inputEmail" name="inputEmail" required>
                    </div>
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="">Telefono 1</label>
                        <input type="tel" id="inputTelefono1" name="inputTelefono1" required>
                    </div>
                    <div class="col-lg-6 col-xl-4 border p-3">
                        <label for="">Telefono 2</label>
                        <input type="tel" id="inputTelefono2" name="inputTelefono2">
                    </div>
                </div>
            </div>
            </div>
        </form>
    </main>
</body>
</html>
